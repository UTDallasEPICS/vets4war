<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Vets4Warriors</title><link rel="stylesheet" href="/portal.css"></head>
<body><main class="login"><p class="eyebrow">Vets4Warriors</p><section class="card"><h1>Welcome back</h1><p class="muted">Sign in with your organization account to access monthly uploads, reports, and the staffing dashboard.</p><p id="message" class="notice error" role="alert" hidden></p><a class="button primary" id="signin" href="/auth/login">Continue with organization account</a><p><small>Access is available to authorized team members. Contact your administrator if you need an account.</small></p></section></main>
<script>const query=new URLSearchParams(location.search);if(query.get('next')==='admin')document.getElementById('signin').href='/auth/login?next=admin';if(query.has('error')){const message=document.getElementById('message');message.hidden=false;message.textContent=query.get('error')==='access'?'This account is not authorized or its email could not be verified. Contact your administrator.':'Sign-in could not be completed. Please try again.'}</script></body></html>
