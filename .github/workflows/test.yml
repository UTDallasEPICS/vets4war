name: CI

# Runs pytest, including ingestion and Node-backed dashboard checks, on pull
# requests and deploy-branch pushes. Database-dependent tests skip without
# credentials; this job does not connect to the shared database.
on:
  pull_request:
  push:
    branches:
      - dev
      - stage
      - prod

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      V4W_DATABASE_URL: ""
      V4W_REQUIRE_AUTH: "false"
      V4W_TEST_DATABASE_URL: postgresql://pipeline_test:pipeline_test@localhost:5432/pipeline_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pipeline_test
          POSTGRES_USER: pipeline_test
          POSTGRES_PASSWORD: pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install --yes libgomp1

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m pytest tests -q -rs
