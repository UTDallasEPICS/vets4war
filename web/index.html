<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vets4Warriors Staffing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a calm, near-solid grid is the work surface; liquid glass is kept
     for the floating chrome (top bar, control dock, detail sheet) that sits
     over a soft colour field. Blur never sits behind the numbers. */
  :root {
    color-scheme: light;
    --field: #eef2fb;
    --blob-a: #7aa7ff; --blob-b: #b9a6ff; --blob-c: #a8f0e0;
    --ink: #0f172a; --ink-2: #475569; --ink-3: #64748b;
    --accent: #3b82f6; --accent-ink: #1d4ed8; --accent-soft: rgba(59,130,246,0.14);
    --glass: rgba(255,255,255,0.55); --glass-strong: rgba(255,255,255,0.86);
    --glass-edge: rgba(255,255,255,0.7); --glass-hi: rgba(255,255,255,0.9);
    --hairline: rgba(15,23,42,0.08); --hairline-2: rgba(15,23,42,0.14);
    --shine: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 42%);
    --shadow: 0 1px 2px rgba(15,23,42,0.06), 0 8px 24px -8px rgba(30,41,90,0.18), 0 24px 48px -24px rgba(30,41,90,0.18);
    --heat-lo: #f3f6fd; --heat-hi: #3b82f6; --heat-max: 55%; --deep-ink: var(--ink);
    --cell: #f6f8fc; --weekend: rgba(15,23,42,0.03);
    --amber: #f59e0b; --amber-ink: #b45309; --amber-soft: #fef3c7;
    --red: #dc2626; --red-ink: #b91c1c; --red-soft: #fee2e2;
    --green-ink: #047857; --green-soft: #d1fae5;
    --font: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, Inter, system-ui, "Segoe UI", Roboto, sans-serif;
    --r-xl: 28px; --r-lg: 20px; --r-md: 12px; --r-sm: 7px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --t: 180ms;
    --sheet: 380px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --field: #0b1020;
      --blob-a: #1e3a8a; --blob-b: #4c1d95; --blob-c: #134e4a;
      --ink: #e2e8f0; --ink-2: #a3b0c4; --ink-3: #8391a7;
      --accent: #60a5fa; --accent-ink: #93c5fd; --accent-soft: rgba(96,165,250,0.16);
      --glass: rgba(20,28,52,0.55); --glass-strong: rgba(17,24,45,0.9);
      --glass-edge: rgba(255,255,255,0.12); --glass-hi: rgba(255,255,255,0.14);
      --hairline: rgba(255,255,255,0.07); --hairline-2: rgba(255,255,255,0.14);
      --shine: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 40%);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -12px rgba(0,0,0,0.6);
      --heat-lo: #172036; --heat-hi: #3b82f6; --heat-max: 70%; --deep-ink: #fff;
      --cell: #141c31; --weekend: rgba(255,255,255,0.025);
      --amber: #fbbf24; --amber-ink: #fbbf24; --amber-soft: rgba(251,191,36,0.14);
      --red: #dc2626; --red-ink: #f87171; --red-soft: rgba(248,113,113,0.14);
      --green-ink: #34d399; --green-soft: rgba(52,211,153,0.14);
    }
  }

  * { box-sizing: border-box; }
  html { background: var(--field); }
  body { margin: 0; min-height: 100vh; font: 14px/1.45 var(--font); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--field); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, input { font: inherit; color: inherit; }

  /* colour field: three soft blobs, static so the glass above never re-blurs */
  .field { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .field i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; }
  .field i:nth-child(1) { width: 52vw; height: 52vw; left: -14vw; top: -18vw; background: var(--blob-a); }
  .field i:nth-child(2) { width: 44vw; height: 44vw; right: -12vw; top: 6vh; background: var(--blob-b); }
  .field i:nth-child(3) { width: 40vw; height: 40vw; left: 30vw; bottom: -22vw; background: var(--blob-c); }

  .glass { position: relative; background: var(--glass); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--shine); pointer-events: none; }
  .surface { background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); }

  .page { max-width: 1680px; margin: 0 auto; padding: var(--s4) max(16px, 2vw) var(--s7); display: flex; flex-direction: column; gap: var(--s4); transition: padding-right var(--t) var(--ease); }
  body.sheet-open .page { padding-right: calc(var(--sheet) + 2 * max(16px, 2vw)); }

  /* ---- top bar ---- */
  .topbar { position: sticky; top: var(--s3); z-index: 20; display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s2) var(--s2) var(--s4); border-radius: 999px; }
  .brand { display: flex; align-items: center; gap: var(--s2); font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .brand svg { color: var(--accent); }
  .brand span { color: var(--ink-3); font-weight: 500; }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 var(--s3); border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .badge.src-synthetic, .badge.src-unlabeled { background: var(--amber-soft); color: var(--amber-ink); }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 var(--s4); border-radius: 999px; border: 1px solid var(--glass-edge); background: var(--glass); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: transform 120ms var(--ease), box-shadow var(--t) var(--ease), background var(--t); box-shadow: inset 0 1px 0 var(--glass-hi); }
  .pill:hover { background: var(--glass-strong); box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 4px var(--accent-soft); }
  .pill:active { transform: scale(0.97); }
  .pill.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 6px 18px -6px rgba(59,130,246,0.7); }
  .pill.primary:hover { box-shadow: 0 8px 24px -6px rgba(59,130,246,0.85), 0 0 0 4px var(--accent-soft); }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 500; cursor: pointer; }
  .linkbtn:hover { text-decoration: underline; }

  /* ---- control dock ---- */
  .dock { position: sticky; top: 70px; z-index: 15; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s4); padding: var(--s3) var(--s5); border-radius: var(--r-xl); }
  .ctl { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
  .ctl > .name { font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .ctl .val { font-size: 13px; font-weight: 600; min-width: 3.4em; white-space: nowrap; }
  .field-in { height: 32px; padding: 0 var(--s2); border-radius: var(--r-md); border: 1px solid var(--hairline-2); background: var(--glass-strong); font-size: 13px; }
  .field-in:hover { border-color: var(--accent); }
  input[type=date].field-in { width: 132px; }
  input[type=number].field-in { width: 52px; text-align: right; }
  input[type=number]#effNum { width: 64px; }
  .muted { color: var(--ink-3); font-size: 12px; }
  .sep { width: 1px; align-self: stretch; background: var(--hairline-2); }
  .range { position: relative; width: 112px; height: 24px; display: flex; align-items: center; }
  .range.roster-range { width: 84px; }
  .ctl .val.roster-val { min-width: 1.2em; }
  .range input { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; margin: 0; background: transparent; cursor: pointer; }
  .range input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) 0 var(--fill, 0%), var(--hairline-2) var(--fill, 0%)); }
  .range input::-moz-range-track { height: 6px; border-radius: 3px; background: var(--hairline-2); }
  .range input::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
  .range input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 4px rgba(15,23,42,0.3), 0 0 0 0.5px rgba(15,23,42,0.1); transition: transform 120ms var(--ease); }
  .range input:active::-webkit-slider-thumb { transform: scale(1.12); }
  .range input::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 4px rgba(15,23,42,0.3); }
  /* 0 to 20% efficiency is not actionable: hatched on the track */
  .range.caution::after { content: ""; position: absolute; left: 0; width: 20%; top: 50%; height: 6px; transform: translateY(-50%); border-radius: 3px 0 0 3px; pointer-events: none;
    background: repeating-linear-gradient(135deg, transparent 0 2px, var(--ink-3) 2px 3px); opacity: 0.45; }
  /* service-level marks: the band the line works in today, and 90% */
  .range .band { position: absolute; top: 50%; height: 12px; transform: translateY(-50%); border-radius: 6px; background: var(--amber); opacity: 0.28; pointer-events: none; }
  .range .tick { position: absolute; top: 2px; bottom: 2px; width: 2px; border-radius: 1px; background: var(--ink-2); opacity: 0.5; pointer-events: none; }
  /* hours: two thumbs on one track */
  .range.dual input { position: absolute; inset: 0; pointer-events: none; }
  .range.dual input::-webkit-slider-runnable-track { background: transparent; }
  .range.dual input::-moz-range-track { background: transparent; }
  .range.dual input::-webkit-slider-thumb { pointer-events: auto; }
  .range.dual input::-moz-range-thumb { pointer-events: auto; }
  .range.dual .rail { position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%); border-radius: 3px;
    background: linear-gradient(to right, var(--hairline-2) 0 var(--a), var(--accent) var(--a) var(--b), var(--hairline-2) var(--b)); }
  .switch { display: inline-flex; align-items: center; gap: var(--s2); cursor: pointer; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .knob { width: 36px; height: 22px; border-radius: 999px; background: var(--hairline-2); position: relative; transition: background var(--t); flex: none; }
  .switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,0.3); transition: transform var(--t) var(--ease); }
  .switch input:checked + .knob { background: #34c759; }
  .switch input:checked + .knob::after { transform: translateX(14px); }
  .switch input:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 2px; }
  .changed { position: fixed; left: 50%; bottom: calc(var(--s5) + env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translateX(-50%); padding: var(--s2) var(--s4); border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: opacity 300ms var(--ease), transform 300ms var(--ease); }
  .changed.quiet { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }

  .banner { padding: var(--s3) var(--s4); border-radius: var(--r-lg); font-size: 13px; }
  .banner.error { background: var(--red-soft); color: var(--red-ink); }
  .banner.note { background: var(--amber-soft); color: var(--amber-ink); }

  /* ---- summary ---- */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s4) var(--s5); padding: var(--s5); border-radius: var(--r-xl); align-items: end; }
  .stat .k { font-size: 13px; color: var(--ink-2); }
  .stat .v { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin-top: 2px; white-space: nowrap; }
  .stat .v small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
  .stat .d { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .stat.lead .v { font-size: 40px; color: var(--red-ink); }
  .stat.lead .d { color: var(--ink-2); max-width: 34ch; }
  .story { grid-column: 1 / -1; margin: 0; padding-top: var(--s4); border-top: 1px solid var(--hairline); font-size: 13px; color: var(--ink-2); }
  .story span { display: block; max-width: 120ch; }
  .story b { color: var(--ink); font-weight: 600; }
  .caveat { margin: 0 0 var(--s4); padding: 0 var(--s5); font-size: 12px; color: var(--ink-3); max-width: 120ch; }
  .is-loading .grid-scroll, .is-loading .summary { opacity: 0.5; transition: opacity var(--t) 120ms; }

  /* ---- grid ---- */
  .board { border-radius: var(--r-xl); overflow: hidden; }
  .grid-scroll { overflow: auto; max-height: calc(100vh - 210px); user-select: none; -webkit-user-select: none; padding: 0 var(--s3) var(--s3); }
  table.grid { border-collapse: separate; border-spacing: 3px; width: max-content; }
  .grid thead th { position: sticky; z-index: 3; background: var(--glass-strong); font-weight: 500; font-size: 11px; color: var(--ink-3); padding: 0; }
  .grid thead tr:first-child th { top: 0; height: 36px; }
  .grid thead tr:last-child th { top: 39px; height: 22px; }
  .grid th.group { text-align: left; padding: 0 var(--s1); font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .grid th.group small { font-weight: 400; color: var(--ink-3); margin-left: var(--s2); font-size: 12px; }
  .grid th.hh { width: 36px; min-width: 36px; text-align: center; }
  .grid th.hh.major { color: var(--ink); font-weight: 600; }
  .grid th.hh.peak { color: var(--accent-ink); font-weight: 600; background-image: radial-gradient(circle, var(--accent) 2px, transparent 2.5px); background-position: center bottom; background-size: 6px 6px; background-repeat: no-repeat; }
  .grid th.roster { width: 84px; min-width: 84px; text-align: center; color: var(--ink-2); }
  .grid th.date, .grid td.date { position: sticky; left: 0; z-index: 2; background: var(--glass-strong); text-align: left; min-width: 116px; width: 116px; padding: 0; }
  .grid thead th.date { z-index: 4; }
  .date-btn { display: block; width: 100%; height: 44px; padding: 0 var(--s2); border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; cursor: pointer; position: relative; }
  .date-btn:hover { background: var(--accent-soft); }
  .date-btn .d { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .date-btn .d span { font-weight: 400; color: var(--ink-2); margin-left: var(--s1); }
  .date-btn .meta { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
  .grid tr.weekend td.date .date-btn { background: var(--weekend); }
  .grid tr.today .date-btn .d { color: var(--accent-ink); }
  .grid tr.today .date-btn .meta { color: var(--accent-ink); }
  .grid tr.holiday .date-btn::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .grid tr.picked .date-btn { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }

  /* hour cell: three cap states, each its own thing.
     under = blue intensity in one step per person; at = amber ring + amber
     numeral; over = red fill, white numeral, corner wedge, plus the service
     level you would get if you could only staff 7. */
  .grid td.h { --lvl: 0; position: relative; width: 36px; min-width: 36px; height: 44px; padding: 0; text-align: center; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
    background: color-mix(in oklab, var(--heat-hi) calc(var(--lvl) * var(--heat-max)), var(--heat-lo)); transition: background var(--t) var(--ease), transform 120ms var(--ease); }
  .grid td.h .n { display: block; line-height: 44px; }
  .grid td.h.deep { color: var(--deep-ink); }
  .grid td.h.cap-under { box-shadow: none; }
  .grid td.h.cap-at { box-shadow: inset 0 0 0 2px var(--amber); color: var(--amber-ink); background: var(--amber-soft); }
  .grid td.h.cap-over { background: var(--red); color: #fff; }
  .grid td.h.cap-over .n { line-height: 1; padding-top: 9px; }
  .grid td.h.cap-over .cl { display: block; font-size: 9px; font-weight: 500; line-height: 1; margin-top: 4px; opacity: 0.9; }
  .grid td.h.cap-over::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 8px 8px 0; border-color: transparent #fff transparent transparent; border-top-right-radius: var(--r-sm); }
  .grid td.h.cap-undef { color: var(--ink-3); }
  .grid td.h.implausible .n { text-decoration: underline dotted; text-underline-offset: 3px; }
  .grid td.h.major { box-shadow: inset 2px 0 0 var(--hairline-2); }
  .grid td.h.major.cap-at { box-shadow: inset 0 0 0 2px var(--amber); }
  .grid td.h:hover { transform: scale(1.08); z-index: 1; box-shadow: 0 4px 12px -2px rgba(15,23,42,0.25); }
  .grid td.h.active, .grid td.h.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .grid td.h.sel.cap-over { outline-color: var(--ink); }

  /* roster: the tour's peak (recommendation) and your planned number, one cell */
  .grid td.roster { width: 84px; min-width: 84px; padding: 4px 6px; border-radius: var(--r-sm); background: var(--cell); text-align: center; vertical-align: middle; box-shadow: inset 0 0 0 1px var(--hairline); }
  .grid td.roster input { width: 100%; height: 22px; padding: 0; border: 0; border-radius: 5px; background: transparent; font-size: 15px; font-weight: 600; text-align: center; -moz-appearance: textfield; }
  .grid td.roster input::-webkit-inner-spin-button, .grid td.roster input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .grid td.roster input:hover, .grid td.roster input:focus { background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--accent); outline: none; }
  .grid td.roster input::placeholder { color: var(--ink); opacity: 1; }
  .grid td.roster.cap-at input::placeholder { color: var(--amber-ink); }
  .grid td.roster.cap-over input::placeholder { color: var(--red-ink); }
  .grid td.roster.own { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .verdict { display: block; font-size: 10px; line-height: 1.2; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
  .v-on-target { color: var(--green-ink); } .v-understaffed { color: var(--red-ink); } .v-overstaffed { color: var(--amber-ink); } .v-exceeds-capacity { color: var(--red-ink); font-weight: 700; }

  .legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); align-items: center; padding: var(--s3) var(--s5); border-top: 1px solid var(--hairline); font-size: 12px; color: var(--ink-2); }
  .legend .sw { display: inline-block; width: 16px; height: 16px; border-radius: 5px; vertical-align: -3px; margin-right: 6px; }
  .legend .sw.under { width: 44px; background: linear-gradient(to right, var(--heat-lo), color-mix(in oklab, var(--heat-hi) var(--heat-max), var(--heat-lo))); }
  .legend .sw.at { background: var(--amber-soft); box-shadow: inset 0 0 0 2px var(--amber); }
  .legend .sw.over { background: var(--red); position: relative; }
  .legend .sw.over::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 6px 6px 0; border-color: transparent #fff transparent transparent; border-top-right-radius: 5px; }
  .legend .sw.hol { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); vertical-align: 0; }
  .legend .sw.own { background: var(--cell); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .legend b { color: var(--ink); font-weight: 600; }
  .gridnote { margin: 0; padding: 0 var(--s5) var(--s4); font-size: 12px; color: var(--ink-3); max-width: 120ch; }

  /* ---- detail sheet: opens when you click a day, an hour or drag a selection ---- */
  .sheet { position: fixed; top: var(--s3); right: max(16px, 2vw); bottom: var(--s3); width: var(--sheet); z-index: 30; border-radius: var(--r-xl); display: flex; flex-direction: column;
    transform: translateX(calc(100% + 40px)); transition: transform 260ms var(--ease); }
  body.sheet-open .sheet { transform: none; }
  .sheet-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s4) var(--s4) var(--s2) var(--s5); }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; flex: 1; min-width: 0; }
  .iconbtn { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--glass-edge); background: var(--glass); cursor: pointer; color: var(--ink-2); }
  .iconbtn:hover { background: var(--glass-strong); color: var(--ink); }
  .iconbtn:active { transform: scale(0.94); }
  .sheet-body { padding: var(--s2) var(--s5) var(--s5); overflow: auto; flex: 1; position: relative; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--s3); }
  .chip { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .chip.over { background: var(--red); color: #fff; } .chip.at { background: var(--amber-soft); color: var(--amber-ink); } .chip.hol { background: var(--accent-soft); color: var(--accent-ink); }
  .hero-n { display: flex; align-items: baseline; gap: var(--s2); margin: var(--s1) 0 var(--s4); }
  .hero-n .n { font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .hero-n .u { font-size: 14px; color: var(--ink-2); }
  .hero-n.cap-over .n { color: var(--red-ink); } .hero-n.cap-at .n { color: var(--amber-ink); }
  .rows { margin: 0; padding: 0; list-style: none; border-radius: var(--r-lg); background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--hairline); }
  .rows li { padding: var(--s3) var(--s4); border-top: 1px solid var(--hairline); }
  .rows li:first-child { border-top: 0; }
  .rows .line { display: flex; justify-content: space-between; gap: var(--s3); }
  .rows .k { color: var(--ink-2); }
  .rows .v { font-weight: 600; white-space: nowrap; }
  .rows .f { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .rows li.out .v { color: var(--red-ink); }
  .reason { margin: var(--s3) 0 0; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--amber-soft); color: var(--amber-ink); font-size: 12px; }
  .hint { color: var(--ink-3); font-size: 13px; margin: 0 0 var(--s3); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-bottom: var(--s4); }
  .tile { padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--hairline); }
  .tile .k { font-size: 12px; color: var(--ink-2); }
  .tile .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .tours { width: 100%; border-collapse: collapse; margin-bottom: var(--s3); }
  .tours th { font-size: 12px; font-weight: 500; color: var(--ink-3); text-align: right; padding: 0 0 var(--s2); }
  .tours th:first-child, .tours td:first-child { text-align: left; }
  .tours td { padding: var(--s2) 0; border-top: 1px solid var(--hairline); text-align: right; font-weight: 600; }
  .tours td:first-child { font-weight: 500; color: var(--ink-2); }
  .verdict .lost { display: block; font-weight: 600; color: var(--red-ink); }
  .tradeoff-head { margin: var(--s4) 0 var(--s2); font-size: 13px; font-weight: 600; }
  .tradeoff-head small { font-weight: 400; color: var(--ink-3); }
  .tradeoff td small { display: block; font-size: 10px; font-weight: 500; color: var(--ink-3); }
  .tradeoff tr.rec td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .tradeoff tr.plan td { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
  .tours td small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); }
  .sheet-foot { margin-top: var(--s4); display: flex; gap: var(--s2); }

  @media (max-width: 1180px) {
    body.sheet-open .page { padding-right: max(16px, 2vw); }
    .sheet { left: max(16px, 2vw); width: auto; top: auto; max-height: 72vh; transform: translateY(calc(100% + 40px)); }
    body.sheet-open .sheet { transform: none; }
    .summary { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 720px) {
    .topbar { border-radius: var(--r-xl); flex-wrap: wrap; }
    .dock { position: static; }
    .sep { display: none; }
    .summary { grid-template-columns: 1fr; }
    .stat.lead .v { font-size: 36px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="page">
  <header class="topbar glass">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2" y="9" width="3.2" height="9" rx="1.6" fill="currentColor" opacity="0.45"/><rect x="8.4" y="5" width="3.2" height="13" rx="1.6" fill="currentColor" opacity="0.7"/><rect x="14.8" y="2" width="3.2" height="16" rx="1.6" fill="currentColor"/></svg>
      Vets4Warriors <span>Staffing</span>
    </div>
    <span class="badge src-unlabeled" id="sourceBadge">Checking data source</span>
    <span class="spacer"></span>
    <button type="button" class="pill" id="exportReport" title="Printable summary of the selected period; save it as a PDF from the print dialog">Export report</button>
    <button type="button" class="pill" id="exportCsv" title="Every hour, with your planned staff and verdicts">Export CSV</button>
    <button type="button" class="pill primary" id="exportPng" title="The grid as currently computed">Export image</button>
  </header>

  <section class="dock glass" aria-label="Forecast settings">
    <div class="ctl">
      <label class="name" for="start">Dates</label>
      <input class="field-in" type="date" id="start" autocomplete="off"><span class="muted">to</span><input class="field-in" type="date" id="end" autocomplete="off">
    </div>
    <span class="sep"></span>
    <div class="ctl" title="Share of a shift a person is free for inbound calls. Below 20% the numbers stop being useful.">
      <label class="name" for="eff">Efficiency</label>
      <div class="range caution"><input type="range" id="eff" min="0" max="100" step="0.1" value="65.6"></div>
      <span class="val"><input class="field-in" type="number" id="effNum" min="0" max="100" step="0.1" value="65.6" inputmode="decimal" autocomplete="off" aria-label="Efficiency percent"> %</span>
    </div>
    <div class="ctl" title="The people actually scheduled today, per shift. The summary shows the hang-ups and answered-in-time this roster gives.">
      <span class="name">Staff per shift</span>
      <label class="muted" for="rosterO">Overnight</label><div class="range roster-range"><input type="range" id="rosterO" min="0" max="10" step="1" value="4" aria-label="Staff, Overnight"></div><span class="val roster-val" id="rosterOVal">4</span>
      <label class="muted" for="rosterD">Day</label><div class="range roster-range"><input type="range" id="rosterD" min="0" max="10" step="1" value="4" aria-label="Staff, Day"></div><span class="val roster-val" id="rosterDVal">4</span>
      <label class="muted" for="rosterE">Evening</label><div class="range roster-range"><input type="range" id="rosterE" min="0" max="10" step="1" value="6" aria-label="Staff, Evening"></div><span class="val roster-val" id="rosterEVal">6</span>
      <button type="button" class="pill" id="rosterRec" title="Set each shift to our recommended peak for the selected dates (capped)">Use recommended</button>
      <button type="button" class="pill" id="rosterReal" title="Back to what the partner actually staffed Oct 14-20 2026">4/4/6</button>
    </div>
    <div class="ctl" title="Amber band: where the line performs today (80 to 85%). Tick: the 90% industry standard.">
      <label class="name" for="sl">Answered</label>
      <div class="range" id="slTrack"><input type="range" id="sl" min="80" max="95" step="1" value="80"></div>
      <span class="val"><input class="field-in" type="number" id="slNum" min="80" max="95" step="1" value="80" inputmode="numeric" autocomplete="off" aria-label="Service level percent"> %</span>
      <label class="muted" for="tsec">within</label>
      <input class="field-in" type="number" id="tsec" min="0" max="3600" step="5" value="30" inputmode="numeric" autocomplete="off"><span class="muted">s</span>
    </div>
    <div class="ctl">
      <span class="name" id="hoursLabel">Hours</span>
      <div class="range dual" id="hoursTrack" role="group" aria-labelledby="hoursLabel">
        <span class="rail"></span>
        <input type="range" id="hFrom" min="0" max="23" step="1" value="0" aria-label="First hour shown">
        <input type="range" id="hTo" min="0" max="23" step="1" value="23" aria-label="Last hour shown">
      </div>
      <span class="val" id="hoursVal">All day</span>
    </div>
    <label class="switch"><input type="checkbox" id="holidays" autocomplete="off" checked><span class="knob"></span>Holiday effects</label>
    </section>
  <div class="changed glass quiet" id="changed" role="status" aria-live="polite"></div>

  <div class="banner error" id="error" role="alert" hidden></div>
  <div class="banner note" id="holidayNote" hidden></div>

  <section class="summary glass" id="summary" aria-label="Window summary"></section>

  <section class="board surface" aria-label="People to schedule per hour">
    <div class="grid-scroll" id="gridScroll">
      <table class="grid" id="grid"><thead id="gridHead"></thead><tbody id="rows"></tbody></table>
    </div>
    <div class="legend" id="legend">
      <span data-legend="under"><span class="sw under"></span>Under the cap, one shade per person (<b id="legendRange"></b>)</span>
      <span data-legend="at"><span class="sw at"></span>At the cap (7; Evening 6)</span>
      <span data-legend="over"><span class="sw over"></span>Over the cap; small line is service level at the cap</span>
      <span><span class="sw own"></span>Your planned number</span>
      <span><span class="sw hol"></span>Holiday</span>
    </div>
    <p class="gridnote" id="gridNote"></p>
    <p class="caveat" id="caveat"></p>
  </section>
</div>

<aside class="sheet glass" id="sheet" aria-label="Details" aria-hidden="true">
  <div class="sheet-head">
    <h2 id="sheetTitle">Details</h2>
    <button type="button" class="iconbtn" id="sheetClose" aria-label="Close details">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<script src="erlang.js"></script>
<script src="logic.js"></script>
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
